{% extends "base.html" %}

{% block title %}Login - AI Resume Screening{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow-lg border-0">
            <div class="card-header bg-primary text-white text-center py-4">
                <h3 class="mb-0">
                    <i class="bi bi-person-circle me-2"></i>Login
                </h3>
                <p class="mb-0 mt-2 opacity-75">Access your resume dashboard</p>
            </div>
            <div class="card-body p-4">
                <form method="POST" action="{{ url_for('auth.login') }}">
                    <div class="mb-3">
                        <label for="username" class="form-label">
                            <i class="bi bi-person me-1"></i>Username
                        </label>
                        <input type="text" class="form-control form-control-lg" id="username"
                               name="username" placeholder="Enter your username" required
                               autofocus>
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label">
                            <i class="bi bi-lock me-1"></i>Password
                        </label>
                        <input type="password" class="form-control form-control-lg" id="password"
                               name="password" placeholder="Enter your password" required>
                    </div>

                    <div class="mb-4 form-check">
                        <input type="checkbox" class="form-check-input" id="remember"
                               name="remember">
                        <label class="form-check-label" for="remember">
                            Remember me
                        </label>
                    </div>

                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary btn-lg">
                            <i class="bi bi-box-arrow-in-right me-2"></i>Login
                        </button>
                    </div>
                </form>

                <hr class="my-4">

                <div class="text-center">
                    <p class="mb-0 text-muted">
                        Don't have an account?
                        <a href="{{ url_for('auth.register') }}" class="text-decoration-none fw-bold">
                            Register here
                        </a>
                    </p>
                </div>
            </div>
        </div>

        <div class="text-center mt-4">
            <p class="text-muted small">
                <i class="bi bi-shield-check me-1"></i>
                Your data is secure with password encryption
            </p>
        </div>
    </div>
</div>
{% endblock %}
